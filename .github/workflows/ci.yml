name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: build, typecheck, lint, test, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Lê a versão do pnpm do campo packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm format:check

  imagem-api:
    name: imagem Docker da API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t camille-api .
      - name: arranca e responde em /health
        run: |
          docker run -d --rm --name camille-api -p 3000:3000 \
            -e NODE_ENV=production \
            -e ANTHROPIC_API_KEY=ci-falsa -e OPENAI_API_KEY=ci-falsa \
            -e CAMILLE_API_KEY=ci-chave-de-teste-0123456789 \
            camille-api
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/health && break || sleep 1
          done
          docker logs camille-api
          docker stop camille-api
